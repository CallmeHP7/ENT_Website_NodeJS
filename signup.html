<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #e3f2fd;
      text-align: center;
    }
    .container {
      width: 50%;
      margin: 50px auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.2);
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .btn {
      background: #007BFF;
      color: white;
      padding: 12px 25px;
      border-radius: 8px;
      text-decoration: none;
      display: inline-block;
      font-weight: bold;
      transition: background 0.3s ease-in-out;
      border: none;
      cursor: pointer;
    }
    .btn:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Sign Up</h2>
    <form id="signupForm" enctype="multipart/form-data">
      <input type="text" name="name" placeholder="Full Name" required>
      <input type="tel" name="mobile" placeholder="Mobile Number" required>
      <input type="email" name="email" placeholder="Email Address" required>
      <input type="text" name="address" placeholder="Address" required>
      
      <!-- New Aadhar Number Input -->
      <input type="text" name="aadhar" placeholder="Aadhar Number" required>
      
      <select name="gender" required>
        <option value="">Select Gender</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
        <option value="other">Other</option>
      </select>

      <label for="dob">Date of Birth:</label>
      <input type="date" id="dob" name="dob" required onchange="calculateAge()">
      <p>Age: <span id="age">-</span></p>

      <input type="password" name="password" placeholder="Password" required>
      <input type="file" id="photo" name="photo" accept="image/*" required>
      <button type="submit" class="btn">Sign Up</button>
    </form>
    <p>Already have an account? <a href="patient_login.html">Login here</a></p>
  </div>

  <script>
    function calculateAge() {
      let dob = document.getElementById("dob").value;
      if (dob) {
        let birthDate = new Date(dob);
        let today = new Date();
        let age = today.getFullYear() - birthDate.getFullYear();
        let monthDiff = today.getMonth() - birthDate.getMonth();
        let dayDiff = today.getDate() - birthDate.getDate();
        
        if (monthDiff < 0 || (monthDiff === 0 && dayDiff < 0)) {
          age--;
        }
        document.getElementById("age").textContent = age;
      } else {
        document.getElementById("age").textContent = "-";
      }
    }

    document.getElementById("signupForm").addEventListener("submit", async function(event) {
      event.preventDefault();
      
      const formData = new FormData(this); // Automatically captures all form inputs, including file

      const response = await fetch("http://localhost:5000/signup", {
        method: "POST",
        body: formData // No need to set headers; FormData handles it
      });

      const result = await response.json();
      alert(result.message);
    });
  </script>
</body>
</html>
